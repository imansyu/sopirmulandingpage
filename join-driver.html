<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabung Jadi Sopir - Sopirmu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <img src="assets/logo.png" alt="Sopirmu Logo" class="navbar-logo" />
      <ul class="navbar-menu" id="nav-menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="index.html#layanan">Layanan</a></li>
        <li><a href="about.html">Tentang</a></li>
        <li><a href="join-driver.html" class="btn-sopir active">Gabung Sopir</a></li>
      </ul>
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    </div>
  </nav>

  <!-- Join Driver Form Section -->
  <section class="join-driver-section">
    <div class="form-container">
      <h1>Gabung Jadi Mitra Sopirmu</h1>
      <p>Isi formulir di bawah ini dan tim kami akan segera menghubungi Anda.</p>
      <form class="driver-form">
        <label for="name">Nama Lengkap</label>
        <input type="text" id="name" name="name" required />

        <label for="phone">Nomor HP Aktif</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="email">Email (Opsional)</label>
        <input type="email" id="email" name="email" />

        <label for="city">Kota Domisili</label>
        <input type="text" id="city" name="city" required />

        <label for="vehicle">Jenis Kendaraan</label>
        <select id="vehicle" name="vehicle" required>
          <option value="">-- Pilih --</option>
          <option value="motor">Motor</option>
          <option value="mobil">Mobil</option>
        </select>

        <button type="submit" class="cta-button">Kirim Formulir</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <img src="assets/logo.png" alt="Sopirmu Logo" class="footer-logo" />
      <p>© 2025 Sopirmu.com | PT Sopirmu Teknologi Nusantara</p>
      <p>📍 Yogyakarta | 📧 support@sopirmu.com | 📞 0895-1403-8299</p>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("nav-menu").classList.toggle("active");
    }
  </script>

</body>
</html>
